name: mt5-backtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download MT5 installer
        run: Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
        shell: powershell

      - name: Silent install (official /auto flag)
        run: Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
        shell: powershell

      - name: First launch in portable mode to initialize MQL5 folder tree, then close
        run: |
          $term = "C:\Program Files\MetaTrader 5\terminal64.exe"
          Start-Process -FilePath $term -ArgumentList "/portable" -PassThru | Out-Null
          Start-Sleep -Seconds 25
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
        shell: powershell

      - name: Locate terminal data folder (portable = install dir)
        id: find
        run: |
          $dataDir = "C:\Program Files\MetaTrader 5"
          Write-Host "Checking $dataDir\MQL5"
          Get-ChildItem $dataDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          echo "DATA_DIR=$dataDir" >> $env:GITHUB_ENV
        shell: powershell

      - name: Copy EA into Experts folder
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\MQL5\Experts" | Out-Null
          Copy-Item -Path "ea\NQ100Tester.mq5" -Destination "$env:DATA_DIR\MQL5\Experts\NQ100Tester.mq5"
          Get-ChildItem "$env:DATA_DIR\MQL5\Experts"
        shell: powershell

      - name: Compile EA
        run: |
          $editor = "C:\Program Files\MetaTrader 5\MetaEditor64.exe"
          $logPath = "$pwd\compile.log"
          Write-Host "editor=$editor exists=$(Test-Path $editor)"
          $p = Start-Process -FilePath $editor -ArgumentList "/compile:`"$env:DATA_DIR\MQL5\Experts\NQ100Tester.mq5`"","/log:`"$logPath`"","/portable" -PassThru
          for ($i=0; $i -lt 24; $i++) {
            Start-Sleep -Seconds 5
            if (Test-Path $logPath) { Write-Host "log appeared after $(($i+1)*5)s"; break }
          }
          Start-Sleep -Seconds 5
          if (Test-Path $logPath) {
            Get-Content $logPath -Encoding Unicode -ErrorAction SilentlyContinue
            Get-Content $logPath -ErrorAction SilentlyContinue
          } else {
            Write-Host "NO compile.log produced"
          }
          $ex5 = "$env:DATA_DIR\MQL5\Experts\NQ100Tester.ex5"
          Write-Host "ex5 exists: $(Test-Path $ex5)"
        shell: powershell

      - name: Write tester.ini (with real demo login, not echoed)
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ini = @"
          [Common]
          Login=$env:MT5_LOGIN
          Password=$env:MT5_PASSWORD
          Server=$env:MT5_SERVER
          [Tester]
          Expert=NQ100Tester
          Symbol=EURUSD
          Period=H1
          Model=1
          FromDate=2024.01.01
          ToDate=2025.01.01
          ForwardMode=0
          Deposit=10000
          Currency=USD
          Leverage=100
          ExecutionMode=0
          Optimization=0
          Report=report
          ReplaceReport=1
          ShutdownTerminal=1
          "@
          Set-Content -Path "tester.ini" -Value $ini -Encoding ASCII
          Write-Host "tester.ini written (credentials hidden)"
          (Get-Content tester.ini) -replace "(Login|Password|Server)=.*","`$1=***"
        shell: powershell

      - name: Run Strategy Tester (headless, connects to real MetaQuotes-Demo server for history)
        run: |
          $term = "C:\Program Files\MetaTrader 5\terminal64.exe"
          $ini = (Resolve-Path "tester.ini").Path
          Start-Process -FilePath $term -ArgumentList "/portable","/config:$ini" -Wait -PassThru
          Start-Sleep -Seconds 30
        shell: powershell

      - name: Collect report
        run: |
          Get-ChildItem -Path "$env:DATA_DIR" -Filter "report*" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host $_.FullName
            Copy-Item $_.FullName -Destination "$pwd\" -Force
          }
          Get-ChildItem "$pwd" -Filter "report*"
        shell: powershell

      - name: Redact credentials before upload
        if: always()
        run: |
          if (Test-Path "tester.ini") {
            (Get-Content "tester.ini") -replace "(Login|Password|Server)=.*","`$1=***REDACTED***" | Set-Content "tester.redacted.ini"
            Remove-Item "tester.ini" -Force
          }
        shell: powershell

      - name: Upload artifacts (logs + report, whatever exists - credentials redacted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-backtest-output
          path: |
            compile.log
            tester.redacted.ini
            report*
          if-no-files-found: warn
