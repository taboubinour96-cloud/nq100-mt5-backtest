# SUPERSEDED / DO NOT RE-ENABLE SCHEDULE:
# Diagnostics proved GitHub Actions (Azure datacenter IPs) cannot connect to FTMO's
# trade server at all (confirmed via connectivity-test2.yml + mt5-backtest.yml runs,
# 2026-11-25) - MetaQuotes-Demo syncs instantly from the same runner, FTMO never does.
# This is almost certainly FTMO's own anti-datacenter/anti-arbitrage IP policy, not a
# code bug. Live trading has been moved to ea/NQ100_D1_Live_FTMO.mq5, an MQL5 Expert
# Advisor meant to run inside MT5 on the user's own PC or a real trading VPS - see
# LIVE_DEPLOYMENT_GUIDE_AR.md. The cron schedule below is intentionally left OFF so
# this workflow does not keep failing silently in the background.
name: ftmo-live-bot

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol to trade (leave empty to run diagnose mode and list candidates)"
        required: false
        default: ""
      diagnose:
        description: "Diagnose mode: just list matching symbols, no trading"
        required: false
        default: "false"
  # schedule intentionally disabled - see note above. The Python MetaTrader5 IPC
  # library also proved unreliable in this CI environment independent of this issue.
  # schedule:
  #   - cron: "10 0 * * 1-5"

permissions:
  contents: read

jobs:
  live-bot:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MetaTrader5 python package
        run: pip install MetaTrader5
        shell: powershell

      - name: Download MT5 installer
        run: Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
        shell: powershell

      - name: Silent install (official /auto flag)
        run: Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
        shell: powershell

      - name: First launch to warm up (initializes MQL5 tree, finishes first-run compilation), then close
        run: |
          $term = "C:\Program Files\MetaTrader 5\terminal64.exe"
          Start-Process -FilePath $term -ArgumentList "/portable" -PassThru | Out-Null
          Start-Sleep -Seconds 60
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
        shell: powershell

      - name: Run live bot (or diagnose)
        env:
          B_LOGIN: ${{ secrets.FTMO_LOGIN }}
          B_PASSWORD: ${{ secrets.FTMO_PASSWORD }}
          B_SERVER: ${{ secrets.FTMO_SERVER }}
          B_SYMBOL: ${{ inputs.symbol }}
          DIAGNOSE: ${{ inputs.diagnose == 'true' && '1' || '0' }}
        run: python bot/live_trader.py
        shell: powershell
